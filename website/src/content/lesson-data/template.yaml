# Sample data for the component showcase (not a real lesson; hubs exclude it).
quiz:
  - q: "What is the default value of a `boolean` **field**?"
    options:
      - text: "`true`"
        why: "A common belief, but fields of type `boolean` default to `false`."
      - text: "`false`"
        correct: true
        why: "Numeric fields default to zero, `boolean` to `false`, references to `null`."
      - text: "It has no default; it must be assigned"
        why: "That's true for **local variables** (definite assignment), not for fields."
  - q: "Which of these are primitive types?"
    options:
      - text: "`int`"
        correct: true
        why: "One of the 8 primitives."
      - text: "`String`"
        why: "`String` is a class, so it's a reference type."
      - text: "`char`"
        correct: true
        why: "A 16-bit UTF-16 code unit."
interview:
  - level: fresher
    q: "What is the difference between the JDK, the JRE and the JVM?"
    answer: |
      The **JVM** runs bytecode. The **JRE** is the JVM plus the class libraries needed to *run* programs. The **JDK**
      adds the developer tools (`javac`, `jar`, `jshell`, `jlink`…) needed to *build* them. Since JDK 11 there is no
      separate JRE download: you build a custom runtime with `jlink`.
    followUps:
      - "Is the JVM platform independent?"
    redFlags:
      - "Saying the JVM is platform independent (bytecode is; the JVM isn't)."
    tests: "Whether you know the modern packaging, not just the textbook diagram."
  - level: senior
    type: design
    q: "How would you choose a garbage collector for a latency-sensitive service?"
    answer: |
      Start from the SLA: for low pause times on large heaps prefer **ZGC** (generational since JDK 21, the only mode since 24) or
      Shenandoah; for throughput-oriented batch jobs **Parallel**; **G1** is the balanced default. Measure with GC logs
      (`-Xlog:gc*`) and JFR under realistic load before and after.
flashcards:
  - front: "Size of `char` in Java?"
    back: "16 bits, an unsigned UTF-16 code unit (not ASCII)."
  - front: "Default value of a `boolean` field?"
    back: "`false`"
