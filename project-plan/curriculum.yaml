# Learning DAG: single source of truth for the website's content structure.
#
# - `tiers`: the "level-up" grouping shown on the site (each tier ends with a Level-up Checkpoint).
# - `lessons`: DAG nodes. `id` = stable URL slug. `prereqs` = DAG edges (must exist, no cycles, prereq tier <= tier).
#   `sources`: note keys (see CONTEXT.md §3) or "gap" for related topics missing from the notes.
#   `audit`: AUDIT.md item ids this lesson must address (every audit item must be mapped at least once).
#   `label`: short name for the sidebar/roadmap; `title`: one-line summary of what the lesson covers.
#   `status`: todo | drafting | review | done
#
# Validate + regenerate the catalogue in CURRICULUM.md with:  python3 project-plan/tools/curriculum.py
# Phase 1 copies/reads this file for the site's sidebar and interactive roadmap.

version: 3
updated: 2026-09-24

levels:
  - {name: Beginner, tiers: [0, 1, 2]}
  - {name: Intermediate, tiers: [3, 4, 5, 6]}
  - {name: Advanced, tiers: [7, 8, 9, 10, 11, 12, 13, 14]}
  - {name: Expert, tiers: [15, 16, 17, 18, 19]}

tiers:
  0: Launchpad
  1: Data & Types
  2: Operators & Control Flow
  3: Methods Essentials
  4: References & Memory Basics
  5: Methods Advanced & Constructors
  6: OOP Core
  7: Special Classes & Patterns
  8: Interfaces & Modern Type Design
  9: Exceptions
  10: Generics
  11: Collections Foundations
  12: Maps, Queues & Sequenced Collections
  13: Functional Java
  14: Streams & Optional
  15: Concurrency Foundations
  16: Modern Concurrency
  17: Reflection & Annotations
  18: JVM Memory & Garbage Collection
  19: Expert Deep Dives

