server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: every route (/path, /lessons/<id>/, …) is served by index.html and handled in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change: cache them for a long time. index.html is always revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
