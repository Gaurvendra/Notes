# Arrays as heap objects: the notes' int[5] (note 06 page 4), an array of references, a jagged 2-D array and an alias.
# Facts: AUDIT.md 6.8 (arrays are objects with a length field; default element values; object arrays hold references;
# 2-D arrays are arrays of arrays), JLS §10.2–§10.7 (array variables, creation, access, the length member), §4.12.5
# (default values).
title: "Arrays live on the heap"
code: |
  public class ArrayMemory {
      public static void main(String[] args) {
          int[] arr = new int[5];
          arr[0] = 10;
          arr[1] = 6;
          String[] names = new String[2];
          names[0] = "Ann";
          int[][] grid = {{1, 2}, {3}};
          int[] same = arr;
          same[4] = 20;
          System.out.println(arr[4] + " " + names[1] + " " + grid[1].length);
      }
  }
steps:
