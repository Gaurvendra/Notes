          - { type: String, name: part, ref: hel }
          - { type: String, name: s5, ref: built }
    heap:
      - { id: args, label: "String[0]" }
      - { id: copy, label: '"hello" (new)' }
      - { id: built, label: '"hello" (run time)' }
      - { id: hello, label: '"hello"', pool: true }
      - { id: hel, label: '"hel"', pool: true }
    out: "true false true"
  - line: 10
    note: "`s5` has the same text as `s1` but is a different object, so `==` is false. `equals` compares the characters, so it's true for every pair here: always compare text with `equals`."
    frames:
