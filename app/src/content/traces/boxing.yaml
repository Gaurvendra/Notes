# Autoboxing, the Integer cache and unboxing. Facts: AUDIT.md 6.12 (the notes' autoboxing/unboxing examples; Integer
# cache: 127 == 127 true, 128 == 128 false, verified in source-notes/verification/batch1), JLS §5.1.7 (boxing
# conversion must return the same object for int values from -128 to 127), §5.1.8 (unboxing), §15.21.3 (== on
# references), Integer.valueOf Javadoc.
title: "Boxing, the cache and unboxing"
code: |
  public class Boxing {
      public static void main(String[] args) {
          int a = 10;
          Integer a1 = a;                 // autoboxing: Integer.valueOf(a)
          Integer b = 127;
          Integer c = 127;
          Integer d = 128;
          Integer e = 128;
          int x1 = d;                     // unboxing: d.intValue()
          System.out.println((b == c) + " " + (d == e) + " " + d.equals(e) + " " + (x1 == e));
      }
  }
