  - line: 9
    note: "`main` returns too: the stack is **empty**. The objects it referred to are now unreachable, so a garbage collector *may* reclaim them, but the JVM is about to exit, so in practice nothing is collected. The pooled `\"24\"` stays reachable through the class's constant pool while the class is loaded (the notes' last picture removes it too)."
