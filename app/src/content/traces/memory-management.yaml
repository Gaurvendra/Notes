  - line: 15
    note: "The closing brace ends the method: its **whole frame is popped at once** (not variable by variable), and `main` continues. The `new String(\"24\")` object is now **unreachable**: nothing points to it. Person and MemoryManagement are still reachable from `main`'s frame."
    frames:
      - name: "memoryManagementTest"
        gone: true
        vars:
          - { type: MemoryManagement, name: this, ref: mm }
          - { type: Person, name: personObj, ref: person }
          - { type: Person, name: personObj2, ref: person }
          - { type: String, name: stringLiteral2, ref: lit }
          - { type: String, name: stringLiteral3, ref: str }
