      - { id: mm, label: "MemoryManagement" }
      - { id: lit, label: '"24"', pool: true }
  - line: 13
    note: "The same literal again, so the **same pooled object**: `stringLiteral2 == stringLiteral` would be `true`. No new String is created."
    frames:
      - name: "memoryManagementTest"
        vars:
          - { type: MemoryManagement, name: this, ref: mm }
          - { type: Person, name: personObj, ref: person }
          - { type: Person, name: personObj2, ref: person }
          - { type: String, name: stringLiteral2, ref: lit, highlight: true }
