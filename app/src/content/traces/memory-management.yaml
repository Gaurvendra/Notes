      - { id: mm, label: "MemoryManagement" }
      - { id: lit, label: '"24"', pool: true, highlight: true }
  - line: 14
    note: "`new String(\"24\")` always creates a **new object** outside the pool, with the same characters. So `stringLiteral3 == stringLiteral2` is `false`, while `equals` is `true`."
    frames:
      - name: "memoryManagementTest"
        vars:
          - { type: MemoryManagement, name: this, ref: mm }
          - { type: Person, name: personObj, ref: person }
          - { type: Person, name: personObj2, ref: person }
          - { type: String, name: stringLiteral2, ref: lit }
          - { type: String, name: stringLiteral3, ref: str, highlight: true }
