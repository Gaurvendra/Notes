# Run:  docker compose up -d --build   then open http://localhost:8080
# Update after pulling new lessons: git pull, then the same command again.
services:
  java-mastery-track:
    build:
      context: .
      dockerfile: Dockerfile
    image: java-mastery-track:latest
    container_name: java-mastery-track
    ports:
      - "8080:80"
    restart: unless-stopped
